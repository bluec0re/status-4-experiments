name: Deploy Experiments to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install wasm-bindgen-cli
        run: |
          # Query exact wasm-bindgen crate version from Cargo metadata or lockfile
          WASM_BINDGEN_VER=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -n 1)
          if [ -z "$WASM_BINDGEN_VER" ] || [ "$WASM_BINDGEN_VER" = "null" ]; then
            WASM_BINDGEN_VER="0.2.129"
          fi
          echo "Installing wasm-bindgen-cli version: $WASM_BINDGEN_VER"
          cargo binstall -y --version "$WASM_BINDGEN_VER" wasm-bindgen-cli

      - name: Bundle city presets
        if: false
        run: |
          echo "Bundling 10x10km city presets for web deployment..."
          cd city && cargo run --bin bundle_presets

      - name: Build experiments
        run: |
          mkdir -p _site

          # Discover all experiment directories (subdirectories containing Cargo.toml)
          EXPERIMENTS=$(find . -maxdepth 2 -mindepth 2 -name "Cargo.toml" -exec dirname {} \; | sed 's|^\./||' | sort -u)
          if [ -z "$EXPERIMENTS" ]; then
            EXPERIMENTS="roads"
          fi

          echo "Experiments to build: $EXPERIMENTS"

          for exp in $EXPERIMENTS; do
            echo "=================================================="
            echo "Building experiment: $exp"
            echo "=================================================="

            # Query package info for this specific experiment directory
            PKG_JSON=$(cargo read-manifest --manifest-path "$exp/Cargo.toml" 2>/dev/null)
            if [ -z "$PKG_JSON" ] || [ "$PKG_JSON" = "null" ]; then
              PKG_JSON=$(cargo metadata --format-version 1 --no-deps | jq -c --arg exp "$exp" '.packages[] | select(.manifest_path | test("/" + $exp + "/Cargo\\.toml$"))' | head -n 1)
            fi

            PKG_NAME=$(echo "$PKG_JSON" | jq -r '.name // empty')
            BIN_NAME=$(echo "$PKG_JSON" | jq -r '.targets[]? | select(.kind[]=="bin") | .name' | head -n 1)
            if [ -z "$BIN_NAME" ] || [ "$BIN_NAME" = "null" ]; then
              BIN_NAME="$PKG_NAME"
            fi
            echo "Resolved PKG_NAME: $PKG_NAME | BIN_NAME: $BIN_NAME"

            # Build for wasm32 with bevy/web feature enabled
            cargo build \
              --manifest-path "$exp/Cargo.toml" \
              --release \
              --target wasm32-unknown-unknown \
              --features bevy/web

            # Locate compiled wasm binary in the workspace target directory
            WASM_PATH="target/wasm32-unknown-unknown/release/$BIN_NAME.wasm"
            if [ ! -f "$WASM_PATH" ]; then
              echo "Error: compiled wasm file not found at $WASM_PATH"
              exit 1
            fi

            EXP_SITE="_site/$exp"
            mkdir -p "$EXP_SITE"

            echo "Running wasm-bindgen into $EXP_SITE..."
            wasm-bindgen \
              --target web \
              --no-typescript \
              --out-dir "$EXP_SITE" \
              --out-name "$BIN_NAME" \
              "$WASM_PATH"

            # Copy assets folder if present
            if [ -d "$exp/assets" ]; then
              echo "Copying assets for $exp..."
              cp -r "$exp/assets" "$EXP_SITE/"
            fi

            # Copy or generate index.html
            if [ -f "$exp/index.html" ]; then
              echo "Copying custom index.html for $exp..."
              cp "$exp/index.html" "$EXP_SITE/index.html"
            elif [ -f "$exp/web/index.html" ]; then
              echo "Copying custom web/index.html for $exp..."
              cp "$exp/web/index.html" "$EXP_SITE/index.html"
            else
              echo "Generating standard index.html for $exp..."
              sed -e "s/{{TITLE}}/$exp/g" -e "s/{{BIN_NAME}}/$BIN_NAME/g" .github/template.html > "$EXP_SITE/index.html"
            fi
          done

          # Setup root landing portal
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
