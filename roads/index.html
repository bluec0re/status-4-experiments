<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bevy Spline Road Editor - Status 4 Experiments</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      touch-action: none;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      z-index: 50;
      transition: opacity 0.5s ease-out;
      pointer-events: all;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(59, 130, 246, 0.15);
      border-top-color: #38bdf8;
      border-right-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    #error-container {
      display: none;
      max-width: 560px;
      margin: 16px;
      padding: 16px 20px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.875rem;
      line-height: 1.5;
      text-align: left;
    }

    #error-container pre {
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Back link button */
    .back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <a href="../" class="back-btn" title="Back to Experiments">← All Experiments</a>

    <div id="loading-overlay">
      <div class="spinner" id="spinner"></div>
      <div class="title" id="status-title">Loading Roads Experiment</div>
      <div class="subtitle" id="status-subtitle">Initializing Bevy engine & WebAssembly...</div>
      <div id="error-container"></div>
    </div>
  </div>

  <script type="module">
    import init from './status-4-roads.js';

    // Prevent context menu on right click to allow seamless camera orbit
    window.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'CANVAS') {
        e.preventDefault();
      }
    });

    async function launch() {
      try {
        await init('./status-4-roads_bg.wasm');
        
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 500);
        }
      } catch (err) {
        console.error('Failed to initialize Bevy WASM application:', err);
        const spinner = document.getElementById('spinner');
        const title = document.getElementById('status-title');
        const subtitle = document.getElementById('status-subtitle');
        const errorContainer = document.getElementById('error-container');

        if (spinner) spinner.style.display = 'none';
        if (title) title.textContent = 'Failed to Load Experiment';
        if (subtitle) subtitle.textContent = 'A WebGPU or WebGL2 compatible browser is required.';

        if (errorContainer) {
          errorContainer.style.display = 'block';
          errorContainer.innerHTML = `
            <strong>Initialization Error:</strong>
            <p>Ensure hardware acceleration is enabled in your browser settings, and that WebGPU/WebGL2 is supported.</p>
            <pre>${escapeHtml(err.toString() + (err.stack ? '\n' + err.stack : ''))}</pre>
          `;
        }
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    launch();
  </script>
</body>
</html>
